[package]
name = "aicommit"
version = "0.3.0"
edition = "2021"
description = "Generates perfect, atomic Git commits using AI — fast, local, reliable"
license = "MIT"
repository = "https://github.com/Mohameddhiab/aicommit"
homepage = "https://github.com/Mohameddhiab/aicommit"
documentation = "https://github.com/Mohameddhiab/aicommit#readme"
readme = "README.md"
keywords = ["git", "ai", "cli", "commit", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "aicommit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = "0.18"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "2"
dialoguer = { version = "0.11", default-features = false }
unicode-width = "0.1"
terminal_size = "0.3"
anyhow = "1"
thiserror = "1"
dirs = "5"
async-trait = "0.1"
glob = "0.3"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
