[package]
name = "git-doctor"
version = "0.2.0"
edition = "2021"
description = "Git History Doctor — diagnose, fix, and maintain clean git history"
license = "MIT"
repository = "https://github.com/Mohameddhiab/git-doctor"
homepage = "https://github.com/Mohameddhiab/git-doctor"
documentation = "https://github.com/Mohameddhiab/git-doctor#readme"
readme = "README.md"
keywords = ["git", "history", "cli", "quality", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "doctor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
git2 = "0.18"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "2"
dialoguer = { version = "0.11", default-features = false }
unicode-width = "0.1"
terminal_size = "0.3"
anyhow = "1"
thiserror = "1"
dirs = "5"
async-trait = "0.1"
glob = "0.3"
open = "5"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
